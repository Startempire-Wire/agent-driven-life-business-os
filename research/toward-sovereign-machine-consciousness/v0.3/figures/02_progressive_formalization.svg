<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616} .head{font-weight:700;font-size:20px} .sub{font-size:14px} .foot{font-size:12px}.frame{fill:#f5f5f5;stroke:#555;stroke-width:2}.edge{fill:none;stroke:#222;stroke-width:2;marker-end:url(#ar)}</style><title>Two valid agent session routes</title><desc>Ad hoc browser work without formal Workstream and formal project mode with verified Workstream. Explicit promotion only, with no retroactive proof.</desc><rect class="frame" x="285" y="30" width="430" height="65" rx="10"/><text class="head" x="500" y="59" text-anchor="middle">Authorized agent invocation</text><text class="sub" x="500" y="80" text-anchor="middle">Principal, retained objective, session identity</text><rect class="frame" x="45" y="165" width="415" height="77" rx="10"/><text class="head" x="252.5" y="194" text-anchor="middle">Goal-directed Ad Hoc</text><text class="sub" x="252.5" y="215" text-anchor="middle">No Workstream prerequisite</text><rect class="frame" x="540" y="165" width="415" height="77" rx="10"/><text class="head" x="747.5" y="194" text-anchor="middle">Formal Project</text><text class="sub" x="747.5" y="215" text-anchor="middle">Verified Workstream and Workpoint</text><rect class="frame" x="45" y="325" width="415" height="76" rx="10"/><text class="head" x="252.5" y="354" text-anchor="middle">Private UIAI Preview</text><text class="sub" x="252.5" y="375" text-anchor="middle">Authorized pixels; not formal Evidence</text><rect class="frame" x="540" y="325" width="415" height="76" rx="10"/><text class="head" x="747.5" y="354" text-anchor="middle">Formal UIAI Evidence</text><text class="sub" x="747.5" y="375" text-anchor="middle">Source-bound capture and verification</text><path class="edge" d="M440 95 L255 165"/><path class="edge" d="M560 95 L745 165"/><path class="edge" d="M255 242 L255 325"/><path class="edge" d="M745 242 L745 325"/><path class="edge" d="M460 205 L535 205"/><text class="sub" x="500" y="195" text-anchor="middle" transform="rotate(-90 500 195)">Promote</text><text class="foot" x="500" y="448" text-anchor="middle">Promotion preserves source history; old previews do not become verified proof retrospectively.</text><text class="foot" x="500" y="472" text-anchor="middle">Real permissions and consequence rules apply to both routes.</text></svg>
