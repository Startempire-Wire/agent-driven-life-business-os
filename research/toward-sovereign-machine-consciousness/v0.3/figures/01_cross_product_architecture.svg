<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616} .head{font-weight:700;font-size:20px} .sub{font-size:14px} .foot{font-size:12px}.frame{fill:#f5f5f5;stroke:#555;stroke-width:2}.edge{fill:none;stroke:#222;stroke-width:2;marker-end:url(#ar)}</style><title>Cross-system authority and execution graph</title><desc>Owner principal to Wirebot to Focusa, then two execution branches UIAI Engine and other executors, finally source-domain verification.</desc><text class="head" x="24" y="32">SOVOS: SOURCE-OWNED RESPONSIBILITIES</text><rect class="frame" x="280" y="52" width="440" height="67" rx="10"/><text class="head" x="500" y="81" text-anchor="middle">Canonical Owner Principal</text><text class="sub" x="500" y="102" text-anchor="middle">Purpose, delegation, revocation</text><rect class="frame" x="320" y="164" width="360" height="67" rx="10"/><text class="head" x="500" y="193" text-anchor="middle">Wirebot / OpenClaw</text><text class="sub" x="500" y="214" text-anchor="middle">Life and business operating partner</text><rect class="frame" x="320" y="276" width="360" height="67" rx="10"/><text class="head" x="500" y="305" text-anchor="middle">Focusa</text><text class="sub" x="500" y="326" text-anchor="middle">Ad hoc or formal governed cognition</text><rect class="frame" x="75" y="405" width="350" height="70" rx="10"/><text class="head" x="250" y="434" text-anchor="middle">UIAI Engine</text><text class="sub" x="250" y="455" text-anchor="middle">Browser observation, actions, proof</text><rect class="frame" x="575" y="405" width="350" height="70" rx="10"/><text class="head" x="750" y="434" text-anchor="middle">Other executors / Veragensia</text><text class="sub" x="750" y="455" text-anchor="middle">API, agents, machine enforcement</text><rect class="frame" x="235" y="526" width="530" height="75" rx="10"/><text class="head" x="500" y="555" text-anchor="middle">Source-domain accepted outcome</text><text class="sub" x="500" y="576" text-anchor="middle">Evidence, reconciliation, settlement and follow-through</text><path class="edge" d="M500 119 L500 164"/><path class="edge" d="M500 231 L500 276"/><path class="edge" d="M420 343 L240 405"/><path class="edge" d="M580 343 L750 405"/><path class="edge" d="M250 475 L440 526"/><path class="edge" d="M750 475 L560 526"/><text class="foot" x="500" y="625" text-anchor="middle">Conceptual ownership model. Not a claim of end-to-end deployed components.</text></svg>
