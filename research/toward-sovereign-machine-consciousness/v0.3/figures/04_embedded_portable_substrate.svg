  .base{stroke:#4a4a4a;stroke-width:2;fill:#fafafa}.major{stroke:#262626;stroke-width:2.5;fill:#eeeeee}.light{stroke:#888;stroke-width:1.3;fill:white}
  .line{stroke:#333;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:1.8;stroke-dasharray:6 6;fill:none}
</style>
