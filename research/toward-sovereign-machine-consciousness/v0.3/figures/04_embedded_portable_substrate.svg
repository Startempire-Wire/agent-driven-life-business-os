<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="title desc">
<title id="title">Reusable Focusa and UIAI substrate embedded across four independent products</title>
<desc id="desc">The sovereign owner and SOVOS constitutional seams bind a Focusa cognitive runtime and a UIAI browser interaction engine. Four domain applications reuse these independently owned services: Wirebot, WorkRouter, Wirebase and Market Lab. Each retains its own authoritative data, deterministic operations and outcome oracle. An agent inference layer can be shared without continuous model calls. This is an architecture model, not measured benchmark data.</desc>
