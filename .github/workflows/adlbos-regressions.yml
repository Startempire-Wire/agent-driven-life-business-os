name: ADLBOS regressions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD

      - name: Run portable regression battery
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check "jsonschema>=4.18,<5"
          bash -n scripts/*.sh
          bash -n tests/*.sh
          bash tests/run-contract-tests.sh
          bash tests/agent-os-scripts-regression.sh
